name: Validate and build domain lists

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: domain-lists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s tests -v
      - name: Validate local lists on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/build_lists.py --offline
      - name: Build with external sources
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_apple.py
          python scripts/update_docker.py
          python scripts/update_openshift.py
          python scripts/update_microsoft365.py
          python scripts/update_pihole_forum.py
          python scripts/build_lists.py
      - name: Publish updated lists on the default branch
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lists/allow/apple.txt lists/allow/docker.txt lists/allow/openshift.txt lists/allow/microsoft365.txt lists/allow/pihole-forum.txt metadata/apple.csv metadata/docker.csv metadata/openshift.csv metadata/microsoft365.csv metadata/microsoft365.json metadata/pihole-forum.csv metadata/pihole-forum-regex.txt pihole/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update generated domain lists'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: domain-lists
          path: |
            dist/*.txt
            pihole/
            lists/allow/apple.txt
            lists/allow/docker.txt
            lists/allow/openshift.txt
            lists/allow/microsoft365.txt
            lists/allow/pihole-forum.txt
            metadata/apple.csv
            metadata/docker.csv
            metadata/openshift.csv
            metadata/microsoft365.csv
            metadata/microsoft365.json
            metadata/pihole-forum.csv
            metadata/pihole-forum-regex.txt
          retention-days: 30
